<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroSafe-AI: Kinematic Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        :root {
            --bg-color: #0a0b10;
            --panel-bg: rgba(20, 25, 35, 0.8);
            --accent-cyan: #00f3ff;
            --accent-red: #ff2a2a;
            --accent-yellow: #ffc800;
            --text-main: #e0e6ed;
            --font-mono: 'Courier New', Courier, monospace;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-mono);
            overflow: hidden;
            display: flex;
            height: 100vh;
        }

        /* Sidebar Controls */
        #sidebar {
            width: 300px;
            background: var(--panel-bg);
            border-right: 1px solid var(--accent-cyan);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 5px 0 20px rgba(0, 243, 255, 0.1);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        h1 {
            font-size: 1.2rem;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--accent-cyan);
            padding-bottom: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .value-display {
            font-size: 0.9rem;
            color: var(--accent-cyan);
            text-align: right;
        }

        /* Main Dashboard */
        #main-view {
            flex-grow: 1;
            display: grid;
            grid-template-rows: 2fr 1fr;
            gap: 10px;
            padding: 20px;
        }

        #simulation-container {
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: radial-gradient(circle at center, #1a1f2e 0%, #000 100%);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas#simCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .overlay-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 4px;
            border-left: 3px solid var(--accent-cyan);
            pointer-events: none;
        }

        #data-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            position: relative;
        }

        .status-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .status-safe { background: rgba(0, 255, 0, 0.2); color: #0f0; border: 1px solid #0f0; }
        .status-caution { background: rgba(255, 200, 0, 0.2); color: var(--accent-yellow); border: 1px solid var(--accent-yellow); }
        .status-danger { background: rgba(255, 0, 0, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }

        .metric {
            margin-top: 10px;
            font-size: 0.9rem;
        }
        .metric span {
            color: var(--accent-cyan);
            font-weight: bold;
        }

        /* Scanline effect */
        body::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

<div id="sidebar">
    <h1>AeroSafe-AI</h1>
    
    <div class="control-group">
        <label>Droplet Diameter (d)</label>
        <input type="range" id="inputDiameter" min="1" max="100" value="5" step="1">
        <div class="value-display"><span id="valDiameter">5</span> &mu;m</div>
    </div>

    <div class="control-group">
        <label>Temperature (T)</label>
        <input type="range" id="inputTemp" min="15" max="40" value="25" step="0.5">
        <div class="value-display"><span id="valTemp">25</span> &deg;C</div>
    </div>

    <div class="control-group">
        <label>Air Exchange (ACH)</label>
        <input type="range" id="inputACH" min="0" max="10" value="0" step="0.5">
        <div class="value-display"><span id="valACH">0</span> /hr</div>
    </div>

    <div style="margin-top:auto; font-size:0.7rem; color:#666;">
        System Status: ONLINE<br>
        Physics Engine: STOKES + SUTHERLAND<br>
        v.1.0.4
    </div>
</div>

<div id="main-view">
    <div id="simulation-container">
        <canvas id="simCanvas"></canvas>
        <div class="overlay-info">
            <div>SIMULATION VIEW</div>
            <div style="font-size: 0.7rem; color: #888;">Render Mode: Kinematic Particle Tracing</div>
        </div>
    </div>

    <div id="data-panel">
        <div class="card">
            <h3>Real-Time Analytics</h3>
            <div id="statusBadge" class="status-badge status-danger">HAZARDOUS</div>
            
            <div class="metric">Air Viscosity (&mu;): <span id="outViscosity">0</span> &mu;Pa&cdot;s</div>
            <div class="metric">Terminal Velocity (Vt): <span id="outVelocity">0</span> cm/s</div>
            <div class="metric">Settling Time (2m): <span id="outTime">0</span> s</div>
            <div class="metric">Inhalation Risk: <span id="outRisk">High</span></div>
        </div>
        <div class="card">
            <canvas id="chartCanvas"></canvas>
        </div>
    </div>
</div>

<script>
    // Constants
    const g = 9.81; // m/s^2
    const rho_p = 900; // Density of wax particle kg/m^3
    const rho_air_ref = 1.225; // Reference air density
    
    // Sutherland's Law Constants for Air
    const C_suth = 110.4; // Sutherland's constant for air
    const T_ref = 293.15; // Reference Temp (20C in Kelvin)
    const mu_ref = 1.827e-5; // Ref Viscosity at T_ref (Pa*s)

    // State
    let state = {
        d: 5, // microns
        T: 25, // Celsius
        ACH: 0, // Air changes per hour
    };

    // Particles System
    const particles = [];
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    let animationFrame;

    // Chart
    let chart;

    // Initialization
    function init() {
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Inputs
        document.getElementById('inputDiameter').addEventListener('input', (e) => { state.d = +e.target.value; update(); });
        document.getElementById('inputTemp').addEventListener('input', (e) => { state.T = +e.target.value; update(); });
        document.getElementById('inputACH').addEventListener('input', (e) => { state.ACH = +e.target.value; update(); });

        initChart();
        update();
        loop();
    }

    function resizeCanvas() {
        canvas.width = document.getElementById('simulation-container').offsetWidth;
        canvas.height = document.getElementById('simulation-container').offsetHeight;
    }

    // Physics Engine
    function calculatePhysics() {
        // 1. Sutherland's Law for Viscosity
        // T must be in Kelvin
        const T_k = state.T + 273.15;
        const mu = mu_ref * ((T_ref + C_suth) / (T_k + C_suth)) * Math.pow((T_k / T_ref), 1.5);

        // 2. Stokes' Law for Terminal Velocity
        // v = (2 * g * r^2 * (rho_p - rho_air)) / (9 * mu)
        // Convert d (microns) to radius (meters)
        const r = (state.d / 2) * 1e-6; 
        
        // Simplified density diff (rho_p >> rho_air, so rho_p - rho_air approx rho_p)
        const v_t = (2 * g * Math.pow(r, 2) * (rho_p - rho_air_ref)) / (9 * mu);

        return { mu, v_t };
    }

    function update() {
        // Update Displays
        document.getElementById('valDiameter').innerText = state.d;
        document.getElementById('valTemp').innerText = state.T;
        document.getElementById('valACH').innerText = state.ACH;

        const phys = calculatePhysics();
        
        // Update Metrics
        // Convert mu to microPa*s for display
        document.getElementById('outViscosity').innerText = (phys.mu * 1e6).toFixed(2);
        // Convert v_t to cm/s for readability
        document.getElementById('outVelocity').innerText = (phys.v_t * 100).toFixed(3);
        
        // Settling time for 2 meters
        const t_settle = 2.0 / phys.v_t;
        document.getElementById('outTime').innerText = t_settle > 3600 ? "> 1 hr" : t_settle.toFixed(1);

        // Risk Assessment
        const badge = document.getElementById('statusBadge');
        const riskText = document.getElementById('outRisk');
        
        if (state.d < 10 && state.ACH < 2) {
            badge.className = "status-badge status-danger";
            badge.innerText = "HAZARDOUS";
            riskText.innerText = "Critical Inhalation Risk (Suspended)";
            riskText.style.color = "var(--accent-red)";
        } else if (state.d < 20 && state.ACH < 5) {
            badge.className = "status-badge status-caution";
            badge.innerText = "CAUTION";
            riskText.innerText = "Moderate Risk";
            riskText.style.color = "var(--accent-yellow)";
        } else {
            badge.className = "status-badge status-safe";
            badge.innerText = "SAFE";
            riskText.innerText = "Low (Rapid Settling / Ventilated)";
            riskText.style.color = "#0f0";
        }

        updateChart(phys.v_t);
    }

    // Animation Loop
    function loop() {
        // Clear
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)'; // Trails effect
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const phys = calculatePhysics();
        
        // Spawn particles
        if (particles.length < 200) {
            particles.push({
                x: canvas.width / 2 + (Math.random() - 0.5) * 50,
                y: 50,
                vx: (Math.random() - 0.5) * 2, 
                life: 1.0
            });
        }

        // Draw particles
        // Scale Factor: Convert real Velocity to Pixels per Frame
        // Let's say 1m height = canvas.height
        // Real v_t is in m/s. 
        // At 60fps, meters per frame = v_t / 60.
        // Pixel per frame = (v_t / 60) * canvas.height * scaling_factor
        
        // Artificial scaling for visualization:
        let fallSpeed = phys.v_t * 5000; 
        // Cap min speed so they don't freeze entirely unless 0
        if (fallSpeed < 0.2) fallSpeed = 0.2; 

        // Apply ACH (Ventilation) as lateral wind
        let windSpeed = state.ACH * 0.5;

        for (let i = 0; i < particles.length; i++) {
            let p = particles[i];
            
            // Movement
            p.y += fallSpeed;
            p.x += windSpeed + (Math.random() - 0.5) * (100 / state.d); // Brownian jitter for small particles

            // Draw
            let color = state.d < 10 ? '#ff2a2a' : '#00f3ff';
            if (state.ACH > 5) color = '#ffffff'; // Ventilated

            let size = Math.max(2, state.d / 5);

            ctx.beginPath();
            ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();

            // Reset if off screen
            if (p.y > canvas.height || p.x > canvas.width || p.x < 0) {
                p.y = 50;
                p.x = canvas.width / 2 + (Math.random() - 0.5) * 50;
            }
        }

        requestAnimationFrame(loop);
    }

    // Chart Logic
    function initChart() {
        const ctxChart = document.getElementById('chartCanvas').getContext('2d');
        
        // Generate dataset for curve
        const dataPoints = [];
        const labels = [];
        // Fixed Temp for curve trace (25C)
        const T_fixed = 298.15; 
        const mu_fixed = mu_ref * ((T_ref + C_suth) / (T_fixed + C_suth)) * Math.pow((T_fixed / T_ref), 1.5);

        for(let d=1; d<=100; d+=5) {
            let r = (d/2) * 1e-6;
            let v = (2 * g * Math.pow(r, 2) * (rho_p - rho_air_ref)) / (9 * mu_fixed);
            labels.push(d);
            dataPoints.push(v * 100); // cm/s
        }

        chart = new Chart(ctxChart, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Settling Vel (cm/s)',
                    data: dataPoints,
                    borderColor: '#00f3ff',
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false }, title: { display: true, text: 'Diameter vs Velocity', color: '#fff' } },
                scales: {
                    x: { title: { display: true, text: 'Diameter (μm)', color: '#666' }, ticks: { color: '#666' } },
                    y: { title: { display: true, text: 'Velocity (cm/s)', color: '#666' }, ticks: { color: '#666' } }
                }
            }
        });
    }

    function updateChart(currentV) {
        // could add a dynamic point here, but for simplicity we leave the curve
    }

    init();
</script>
</body>
</html>
